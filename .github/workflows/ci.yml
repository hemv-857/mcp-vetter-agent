name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          # Pinned: an unpinned ruff silently changes which rules fire on
          # release, which turned this pipeline red on 0.17.0 (UP041).
          # Bump it deliberately, in a PR.
          pip install 'ruff==0.17.0'
          ruff check probe_server/ tests/
      - name: Test
        run: pytest tests/ -v
