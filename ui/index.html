    <!--
      MCP Vetting — a security investigation instrument.

      DIRECTION: containment and instrumentation (see ui/DESIGN_DIRECTION.md).
      A third-party MCP server is a specimen. One instrument reads its source
      without running it; the other runs it sealed and watches what escapes.
      The two channels keep separate visual languages — static is orthogonal,
      square and hollow; dynamic is curved, round and filled — and only merge
      at synthesis. Then the machine stops, because publishing is not reading.

      Dark only. Seven hues carry meaning and nothing else does.
